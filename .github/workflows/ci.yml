name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify generated files are in sync with their sources
        run: |
          node build.js
          git diff --exit-code
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm test
