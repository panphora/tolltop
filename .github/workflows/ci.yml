name: CI

on:
  # Manual only (2026-10-23). Running on every push reported failures from
  # work in progress; dispatch it when preparing a release or deploy:
  #   gh workflow run ci.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Verify generated files are in sync with their sources
        run: |
          node build.js
          git diff --exit-code
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm test
